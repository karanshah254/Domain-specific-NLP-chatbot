<mat-toolbar color="primary">
  <!-- <mat-icon></mat-icon> -->
  <span style="flex: 1; text-align: center">
    <mat-icon style="margin-right: 10px">smart_toy</mat-icon>
    VGEC Intelligent Assistant</span
  >
</mat-toolbar>

<div class="chat-wrapper">
  <mat-card class="chat-card">
    <div class="chat-box">
      <div
        *ngFor="let msg of messages"
        [ngClass]="msg.sender === 'user' ? 'user-container' : 'bot-container'"
      >
        <!-- USER MESSAGE -->
        <div *ngIf="msg.sender === 'user'" class="user-msg">
          <b>You</b>: {{ msg.text }}
        </div>

        <!-- BOT MESSAGE -->
        <div
          *ngIf="msg.sender === 'bot'"
          class="bot-msg"
          [innerHTML]="'<b>VBot</b>: ' + msg.text"
        ></div>
      </div>

      <!-- ✅ Typing Indicator (Separate from messages loop) -->
      <div *ngIf="isLoading" class="bot-container typing-animation">
        <div class="bot-msg"><b>VBot</b>: Typing........</div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="input-section">
      <mat-form-field appearance="outline" class="full-width">
        <input
          matInput
          placeholder="Ask me anything..."
          [(ngModel)]="userMessage"
          (keyup.enter)="sendMessage()"
        />
      </mat-form-field>

      <button
        mat-icon-button
        color="primary"
        class="send-button"
        (click)="sendMessage()"
        [disabled]="isLoading"
      >
        <mat-icon>arrow_upward</mat-icon>
      </button>
    </div>
  </mat-card>
</div>
